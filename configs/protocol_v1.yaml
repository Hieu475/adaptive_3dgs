# Scientific Experimental Protocol v1 (Confirmatory Protocol)
# Strict adherence to frozen experimental hyperparameters to eliminate researcher degrees of freedom.

protocol_version: "1.0.0"
date_locked: "2026-09-03"

thesis_formulation:
  title: "Gaussian-level marginal utility estimation for online RGB-D reconstruction under a fixed compute budget"
  rq1: "Can observable Gaussian state predict marginal reconstruction gain? (s_i -> U_i^*)"
  rq2: "Does better utility prediction produce better Gaussian selection under equal compute? (U_hat_i -> S_B)"
  rq3: "Does utility-driven scheduling improve online reconstruction quality under a fixed per-frame budget over time? (S_B -> Q(t))"

reproducibility:
  seeds: [42, 43, 44, 45, 46]  # Multi-seed validation (n=5)
  device: "cpu"                  # Default test device (switch to "cuda" when GPU available)
  deterministic_torch: true

datasets:
  tum_fr1_desk:
    path: "datasets/TUM/rgbd_dataset_freiburg1_desk"
    camera: "freiburg1"
    depth_scale: 5000.0
    image_width: 320             # Scientifically meaningful resolution (not 48x64)
    image_height: 240
    frame_stride: 1
    eval_horizon_frames: 60      # Min frames to avoid 4-5 frame saturation
  tum_fr2_xyz:
    path: "datasets/TUM/rgbd_dataset_freiburg2_xyz"
    camera: "freiburg2"
    depth_scale: 5000.0
    image_width: 320
    image_height: 240
    frame_stride: 1
    eval_horizon_frames: 60

splits:
  train_scenes:
    - "tum_fr1_desk_frames_0_to_40"
  validation_scenes:
    - "tum_fr1_desk_frames_41_to_60"
  test_cross_scene:
    - "tum_fr2_xyz"

oracle_specification:
  n_opt_steps: 5
  optimizer: "SelectiveAdam"
  learning_rate: 0.001
  w_rgb: 0.70
  w_depth: 0.30
  min_influence_pixels: 25        # M_min filter for unstable local regions
  unclamped_utility: true         # U_i^* in Real (negative utility preserved)
  group_additivity_sizes: [1, 4, 16]

state_factors:
  appearance: ["rgb_error"]
  geometry: ["depth_error", "gradient_norm"]
  visibility: ["visibility_count", "influence_mass"]
  temporal: ["position_drift", "residual_drift_ema"]
  uncertainty: ["uncertainty_var"]
  cost: ["projected_area", "tile_footprint"]
  pre_fusion_normalization: true

budget_levels:
  optimization_relative: [0.10, 0.20, 0.40, 0.60, 0.80]
  wall_clock_ms: [10.0, 15.0, 20.0, 33.3]

metrics_hierarchy:
  gate1:
    - "utility_variance_var_u_star"
    - "optimization_headroom_H"
    - "repeatability_cv"
  gate2:
    - "spearman_rho"
    - "ndcg_at_k"
    - "overlap_at_k"
    - "regret_at_k"
  gate3:
    - "oracle_selection_efficiency_OSE"
    - "realized_delta_psnr_at_B"
    - "realized_delta_depth_at_B"
  gate4:
    - "psnr_trajectory"
    - "ssim_trajectory"
    - "depth_l1_trajectory"
    - "memory_gaussian_count"

statistical_testing:
  confidence_interval_level: 0.95
  bootstrap_resamples: 1000
  paired_tests: "wilcoxon"
  effect_size_metric: "cohens_d"
  min_sample_size_for_correlation: 5
