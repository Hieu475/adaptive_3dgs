# Baseline experiment configuration
# All experiments MUST use these fixed conditions for fair comparison
experiment:
  seed: 42
  frames: 200
  width: 640
  height: 480
  dataset: 'synthetic'  # or 'tum', 'replica'
  scene: 'room_0'

gaussian:
  sh_degree: 0
  initial_opacity: 0.5
  initial_scale: 0.01
  max_gaussians: 500000

rendering:
  tile_size: 16
  use_surface_aware_depth: true
  depth_threshold_opaque: 0.5
  attribution_top_k: 8

losses:
  weight_color: 1.0
  weight_depth: 0.5
  weight_normal: 0.1
  weight_regularization: 0.01

importance:
  depth_error: 1.0
  color_error: 1.0
  normal_error: 0.5
  visibility: 0.1
  temporal: 0.5
  screen_space: 0.2

training:
  learning_rate:
    position: 1.6e-4
    scale: 5e-3
    rotation: 1e-3
    opacity: 5e-2
    sh: 2.5e-3

densification:
  max_new_per_frame: 500
  strategy: 'importance'
  use_adaptive_thresholds: true
  adaptive_k: 2.0
  error_threshold_color: 0.1
  error_threshold_depth: 0.05
  transmission_threshold: 0.5
  lambda_color: 1.0
  lambda_depth: 1.0
  lambda_transmission: 0.5

scheduler:
  gpu_budget_ms: 16.6
  tier_thresholds: [0.8, 0.5, 0.2]
  optimize_every_n_frames: 5
  policy: 'budget_aware'
  optimize_ratio: 0.5
  cost_per_gaussian_us: 0.5
